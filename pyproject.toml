[project]
name = "sherlog"
version = "0.1.0"
description = "An LLM agent that investigates production incidents in a simulated system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
sherlog = "sherlog.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs `docker compose up -d` (deselect with -m 'not integration')",
]
addopts = "-m 'not integration'"
